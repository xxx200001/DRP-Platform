# =============================================================================
# 检验指标参考区间 + 校验规则总表
# =============================================================================
# 【上线前必须做的事 —— 算法负责人签字确认】
#
# 下面的参考区间取自 WS/T 404《临床常用生化检验项目参考区间》系列行标 与
# 全国临床检验操作规程通用值，只能当作 **冷启动默认值**。
#
# 参考区间受仪器、试剂厂商、检测方法、地域人群影响，实验室之间差异可以到
# 20% 以上。偏离度特征（deviation）直接建立在参考区间之上，区间错了，
# 整个 2.2 节的临床衍生特征全部带偏，而且这种错误在训练集上看不出来
# （因为训练集同样带偏），只会在换医院、换检验科的时候线上暴雷。
#
# 上线前必须用合作医院检验科出具的本院参考区间覆盖本文件，并按
# lab_id 维度做多版本管理（见 reference.py 的 lab_id 参数）。
#
# 字段说明:
#   aliases           OCR/结构化归一化词典入口（规范 4.1），大小写与空格不敏感
#   canonical_unit    平台内部唯一单位，所有数据入库前强制换算到此单位
#   unit_conversions  外部单位 -> canonical 的乘法因子
#   plausible_range   生理极限。超出直接判 INVALID 拒绝入模（规范 4.1）
#   magnitude_fix     是否允许 x1000 / /1000 量级自动纠错
#   critical          危急值，触发后走告警通道，不参与常规分级
#   grade_multiplier  异常分级边界，倍数相对参考区间上限/下限
#   cv_intra          个体内生物学变异系数（Ricós 生物学变异数据库）
#   cv_analytical     分析变异系数，用于计算 RCV 判定"变化是否真实"
#   log_transform     右偏指标建议对数化后再算趋势斜率
#   reference         分层参考区间，匹配时取最具体的一条
# =============================================================================

version: "2024.1-default"
